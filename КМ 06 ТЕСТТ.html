<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>КМ-06 Тест — 100 сұрақ</title>
  <style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#0d1117; --surface:#161b22; --card:#1c2128; --border:#30363d;
  --accent:#58a6ff; --accent2:#3fb950; --danger:#f85149;
  --text:#e6edf3; --muted:#8b949e; --radius:14px; --shadow:0 8px 32px rgba(0,0,0,.45);
}
html,body { height:100%; font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); overflow-x:hidden; }
.hidden { display:none !important; }
#splash { min-height:100vh; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; }
.bg-grid { position:absolute; inset:0; background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px); background-size:40px 40px; opacity:.35; pointer-events:none; }
.splash-inner { position:relative; z-index:1; text-align:center; padding:3rem 2rem; max-width:520px; animation:fadeUp .6s ease both; }
.badge { display:inline-block; background:linear-gradient(135deg,var(--accent),#1f6feb); color:#fff; font-size:.75rem; font-weight:700; letter-spacing:.12em; padding:.35rem .9rem; border-radius:100px; margin-bottom:1.5rem; text-transform:uppercase; }
.splash-inner h1 { font-size:clamp(1.8rem,5vw,2.8rem); font-weight:800; line-height:1.2; margin-bottom:1rem; background:linear-gradient(135deg,#e6edf3,var(--accent)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.subtitle { color:var(--muted); font-size:1rem; margin-bottom:2rem; }
.meta-row { display:flex; gap:1.5rem; justify-content:center; flex-wrap:wrap; margin-bottom:2.5rem; color:var(--muted); font-size:.9rem; }
.btn-primary { display:inline-flex; align-items:center; gap:.5rem; background:var(--accent); color:#0d1117; font-size:1rem; font-weight:700; padding:.85rem 2.2rem; border:none; border-radius:100px; cursor:pointer; transition:transform .15s,box-shadow .15s,background .15s; }
.btn-primary:hover { background:#79c0ff; transform:translateY(-2px); box-shadow:0 8px 24px rgba(88,166,255,.35); }
.btn-outline { display:inline-flex; align-items:center; background:transparent; color:var(--accent); font-size:.95rem; font-weight:600; padding:.8rem 2rem; border:1.5px solid var(--accent); border-radius:100px; cursor:pointer; transition:background .15s; margin-top:.8rem; }
.btn-outline:hover { background:rgba(88,166,255,.08); }
#quiz { min-height:100vh; display:flex; flex-direction:column; }
.quiz-header { display:flex; align-items:center; gap:1rem; padding:1rem 1.5rem; background:var(--surface); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10; }
.header-badge { font-size:.7rem; font-weight:800; letter-spacing:.1em; background:var(--accent); color:#0d1117; padding:.25rem .65rem; border-radius:6px; text-transform:uppercase; }
.progress-wrap { flex:1; display:flex; align-items:center; gap:.8rem; }
.progress-bar-bg { flex:1; height:6px; background:var(--border); border-radius:100px; overflow:hidden; }
.progress-bar-fill { height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); border-radius:100px; transition:width .4s ease; width:0%; }
.progress-label { font-size:.8rem; color:var(--muted); white-space:nowrap; }
.score-chip { background:rgba(63,185,80,.15); color:var(--accent2); font-size:.85rem; font-weight:700; padding:.3rem .8rem; border-radius:100px; border:1px solid rgba(63,185,80,.3); }
.quiz-main { flex:1; display:flex; align-items:flex-start; justify-content:center; padding:2rem 1rem; }
.question-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:2rem; width:100%; max-width:680px; box-shadow:var(--shadow); }
.q-number { font-size:.75rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); margin-bottom:.75rem; }
.q-text { font-size:1.15rem; font-weight:600; line-height:1.55; margin-bottom:1.5rem; }
.options-grid { display:flex; flex-direction:column; gap:.65rem; }
.option-btn { display:flex; align-items:center; gap:.9rem; width:100%; background:var(--surface); border:1.5px solid var(--border); border-radius:10px; padding:.85rem 1.1rem; color:var(--text); font-size:.95rem; font-weight:500; cursor:pointer; text-align:left; transition:border-color .15s,background .15s,transform .1s; }
.option-btn:hover:not(:disabled) { border-color:var(--accent); background:rgba(88,166,255,.07); transform:translateX(3px); }
.opt-label { display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; background:var(--border); border-radius:6px; font-size:.8rem; font-weight:800; color:var(--muted); flex-shrink:0; transition:background .15s,color .15s; }
.option-btn.correct { border-color:var(--accent2); background:rgba(63,185,80,.1); }
.option-btn.correct .opt-label { background:var(--accent2); color:#0d1117; }
.option-btn.wrong { border-color:var(--danger); background:rgba(248,81,73,.1); }
.option-btn.wrong .opt-label { background:var(--danger); color:#fff; }
.feedback { margin-top:1.2rem; padding:.75rem 1rem; border-radius:8px; font-size:.9rem; font-weight:600; }
.correct-fb { background:rgba(63,185,80,.12); color:var(--accent2); border:1px solid rgba(63,185,80,.3); }
.wrong-fb { background:rgba(248,81,73,.12); color:#f85149; border:1px solid rgba(248,81,73,.3); }
.btn-next { display:block; width:100%; margin-top:1.2rem; padding:.9rem; background:var(--accent); color:#0d1117; font-size:.95rem; font-weight:700; border:none; border-radius:10px; cursor:pointer; transition:background .15s; }
.btn-next:hover { background:#79c0ff; }
#result { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem 1rem; }
.result-inner { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:3rem 2rem; max-width:500px; width:100%; text-align:center; box-shadow:var(--shadow); animation:fadeUp .5s ease both; }
.result-emoji { font-size:3.5rem; margin-bottom:1rem; }
.result-inner h2 { font-size:1.7rem; font-weight:800; margin-bottom:.75rem; }
.result-score { font-size:2.8rem; font-weight:900; color:var(--accent); margin-bottom:.75rem; }
.result-msg { color:var(--muted); margin-bottom:2rem; line-height:1.5; }
.result-stats { display:flex; gap:1rem; justify-content:center; margin-bottom:2rem; flex-wrap:wrap; }
.stat-box { flex:1; min-width:90px; padding:1rem .75rem; border-radius:10px; border:1px solid var(--border); }
.stat-box span { display:block; font-size:1.6rem; font-weight:800; }
.stat-box label { font-size:.75rem; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; }
.correct-box span { color:var(--accent2); } .wrong-box span { color:var(--danger); } .pct-box span { color:var(--accent); }
#review { min-height:100vh; padding:1rem; }
.review-header { display:flex; align-items:center; gap:1rem; padding:1rem 0 1.5rem; max-width:720px; margin:0 auto; }
.review-header h2 { font-size:1.2rem; font-weight:700; }
.btn-back { background:var(--surface); border:1px solid var(--border); color:var(--text); padding:.5rem 1rem; border-radius:8px; cursor:pointer; font-size:.9rem; }
.review-list { max-width:720px; margin:0 auto; display:flex; flex-direction:column; gap:1rem; padding-bottom:3rem; }
.review-item { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:1.25rem; }
.review-q { font-weight:600; margin-bottom:1rem; line-height:1.5; display:flex; gap:.75rem; }
.review-num { background:var(--danger); color:#fff; font-size:.7rem; font-weight:800; padding:.2rem .5rem; border-radius:5px; flex-shrink:0; }
.review-options { display:flex; flex-direction:column; gap:.4rem; }
.review-opt { padding:.55rem .85rem; border-radius:7px; font-size:.88rem; border:1px solid var(--border); display:flex; gap:.5rem; }
.review-opt span { font-weight:700; color:var(--muted); }
.r-correct { background:rgba(63,185,80,.1); border-color:rgba(63,185,80,.4); color:var(--accent2); }
.r-correct span { color:var(--accent2); }
.r-wrong { background:rgba(248,81,73,.1); border-color:rgba(248,81,73,.35); color:var(--danger); }
.r-wrong span { color:var(--danger); }
@keyframes fadeUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
.slide-in { animation:fadeUp .3s ease both; }
@media(max-width:480px){ .question-card{padding:1.25rem} .q-text{font-size:1rem} .result-inner{padding:2rem 1.25rem} }
  </style>
</head>
<body>

<div id="splash">
  <div class="splash-inner">
    <div class="badge">КМ-06</div>
    <h1>Ауаны баптау<br>және желдету жүйелері</h1>
    <p class="subtitle">100 сұрақтан тұратын тест тапсырмасы</p>
    <div class="meta-row">
      <span>⏱ Уақыт шектеусіз</span>
      <span>📋 100 сұрақ</span>
      <span>✅ 4 нұсқа</span>
    </div>
    <button id="startBtn" class="btn-primary">Тестті бастау →</button>
  </div>
  <div class="bg-grid"></div>
</div>

<div id="quiz" class="hidden">
  <header class="quiz-header">
    <span class="header-badge">КМ-06</span>
    <div class="progress-wrap">
      <div class="progress-bar-bg"><div id="progressBar" class="progress-bar-fill"></div></div>
      <span id="progressText" class="progress-label">1 / 100</span>
    </div>
    <span id="scoreDisplay" class="score-chip">✓ 0</span>
  </header>
  <main class="quiz-main">
    <div class="question-card" id="questionCard">
      <div class="q-number" id="qNumber">Сұрақ 1</div>
      <div class="q-text" id="qText"></div>
      <div class="options-grid" id="optionsGrid"></div>
      <div id="feedback" class="feedback hidden"></div>
      <button id="nextBtn" class="btn-next hidden">Келесі сұрақ →</button>
    </div>
  </main>
</div>

<div id="result" class="hidden">
  <div class="result-inner">
    <div id="resultEmoji" class="result-emoji">🎉</div>
    <h2 id="resultTitle">Тамаша!</h2>
    <div id="resultScore" class="result-score">85 / 100</div>
    <p id="resultMsg" class="result-msg"></p>
    <div class="result-stats">
      <div class="stat-box correct-box"><span id="correctCount">0</span><label>Дұрыс</label></div>
      <div class="stat-box wrong-box"><span id="wrongCount">0</span><label>Қате</label></div>
      <div class="stat-box pct-box"><span id="pctCount">0%</span><label>Нәтиже</label></div>
    </div>
    <button id="retryBtn" class="btn-primary">Қайта тапсыру ↺</button>
    <button id="reviewBtn" class="btn-outline">Қателерді қарау</button>
  </div>
</div>

<div id="review" class="hidden">
  <div class="review-header">
    <button id="backBtn" class="btn-back">← Артқа</button>
    <h2>Қателер талдауы</h2>
  </div>
  <div id="reviewList" class="review-list"></div>
</div>

<script>

// ── State ─────────────────────────────────────────────
let questions = [];
let current = 0;
let score = 0;
let answered = false;
let wrongAnswers = [];

// ── DOM refs ──────────────────────────────────────────
const splash       = document.getElementById('splash');
const quizScreen   = document.getElementById('quiz');
const resultScreen = document.getElementById('result');
const reviewScreen = document.getElementById('review');

const startBtn   = document.getElementById('startBtn');
const nextBtn    = document.getElementById('nextBtn');
const retryBtn   = document.getElementById('retryBtn');
const reviewBtn  = document.getElementById('reviewBtn');
const backBtn    = document.getElementById('backBtn');

const qNumber    = document.getElementById('qNumber');
const qText      = document.getElementById('qText');
const optionsGrid= document.getElementById('optionsGrid');
const feedback   = document.getElementById('feedback');
const progressBar= document.getElementById('progressBar');
const progressTxt= document.getElementById('progressText');
const scoreDisp  = document.getElementById('scoreDisplay');

// ── Helpers ───────────────────────────────────────────
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function show(el) { el.classList.remove('hidden'); }
function hide(el) { el.classList.add('hidden'); }

// ── Init ──────────────────────────────────────────────
function initQuiz() {
  questions = shuffle([...QUESTIONS]);
  current = 0;
  score = 0;
  answered = false;
  wrongAnswers = [];
  scoreDisp.textContent = '✓ 0';
  renderQuestion();
}

// ── Render question ───────────────────────────────────
function renderQuestion() {
  answered = false;
  const q = questions[current];
  const labels = ['A', 'B', 'C', 'D'];

  // Progress
  const pct = ((current) / questions.length) * 100;
  progressBar.style.width = pct + '%';
  progressTxt.textContent = `${current + 1} / ${questions.length}`;

  // Card entrance
  const card = document.getElementById('questionCard');
  card.classList.remove('slide-in');
  void card.offsetWidth;
  card.classList.add('slide-in');

  qNumber.textContent = `Сұрақ ${current + 1}`;
  qText.textContent = q.q;

  // Options
  optionsGrid.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="opt-label">${labels[i]}</span><span class="opt-text">${opt}</span>`;
    btn.addEventListener('click', () => selectAnswer(i, btn, q.answer));
    optionsGrid.appendChild(btn);
  });

  hide(feedback);
  hide(nextBtn);
}

// ── Answer selection ──────────────────────────────────
function selectAnswer(idx, btn, correctIdx) {
  if (answered) return;
  answered = true;

  const allBtns = optionsGrid.querySelectorAll('.option-btn');

  allBtns.forEach(b => b.disabled = true);

  if (idx === correctIdx) {
    btn.classList.add('correct');
    score++;
    scoreDisp.textContent = `✓ ${score}`;
    feedback.className = 'feedback correct-fb';
    feedback.innerHTML = '✅ Дұрыс!';
  } else {
    btn.classList.add('wrong');
    allBtns[correctIdx].classList.add('correct');
    feedback.className = 'feedback wrong-fb';
    feedback.innerHTML = `❌ Қате! Дұрыс жауап: <strong>${['A','B','C','D'][correctIdx]}</strong>`;
    wrongAnswers.push({ q: questions[current], chosen: idx });
  }

  show(feedback);
  show(nextBtn);

  if (current === questions.length - 1) {
    nextBtn.textContent = 'Нәтижені көру →';
  } else {
    nextBtn.textContent = 'Келесі сұрақ →';
  }
}

// ── Next ──────────────────────────────────────────────
nextBtn.addEventListener('click', () => {
  current++;
  if (current < questions.length) {
    renderQuestion();
  } else {
    showResult();
  }
});

// ── Result ────────────────────────────────────────────
function showResult() {
  hide(quizScreen);
  show(resultScreen);

  const pct = Math.round((score / questions.length) * 100);
  const wrong = questions.length - score;

  document.getElementById('correctCount').textContent = score;
  document.getElementById('wrongCount').textContent = wrong;
  document.getElementById('pctCount').textContent = pct + '%';
  document.getElementById('resultScore').textContent = `${score} / ${questions.length}`;

  let emoji, title, msg;
  if (pct >= 90) {
    emoji = '🏆'; title = 'Керемет нәтиже!'; msg = 'Сіз тестті өте жоғары деңгейде тапсырдыңыз!';
  } else if (pct >= 70) {
    emoji = '🎉'; title = 'Жақсы нәтиже!'; msg = 'Материалды жақсы білесіз. Аздап жаттықсаңыз болады.';
  } else if (pct >= 50) {
    emoji = '📚'; title = 'Орташа нәтиже'; msg = 'Материалды қайта қарап, тестті қайта тапсырып көріңіз.';
  } else {
    emoji = '💪'; title = 'Көп жаттығу керек'; msg = 'Материалды тереңдетіп оқу ұсынылады.';
  }

  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultMsg').textContent = msg;

  if (wrongAnswers.length === 0) {
    reviewBtn.style.display = 'none';
  } else {
    reviewBtn.style.display = 'inline-flex';
  }
}

// ── Retry ─────────────────────────────────────────────
retryBtn.addEventListener('click', () => {
  hide(resultScreen);
  show(quizScreen);
  initQuiz();
});

// ── Review ────────────────────────────────────────────
reviewBtn.addEventListener('click', () => {
  hide(resultScreen);
  show(reviewScreen);
  buildReview();
});

backBtn.addEventListener('click', () => {
  hide(reviewScreen);
  show(resultScreen);
});

function buildReview() {
  const list = document.getElementById('reviewList');
  list.innerHTML = '';
  const labels = ['A', 'B', 'C', 'D'];

  wrongAnswers.forEach((item, idx) => {
    const { q, chosen } = item;
    const div = document.createElement('div');
    div.className = 'review-item';
    div.innerHTML = `
      <div class="review-q"><span class="review-num">${idx + 1}</span>${q.q}</div>
      <div class="review-options">
        ${q.options.map((opt, i) => `
          <div class="review-opt ${i === q.answer ? 'r-correct' : i === chosen ? 'r-wrong' : ''}">
            <span>${labels[i]}</span> ${opt}
            ${i === q.answer ? ' ✅' : i === chosen ? ' ❌' : ''}
          </div>
        `).join('')}
      </div>
    `;
    list.appendChild(div);
  });
}

// ── Start ─────────────────────────────────────────────
startBtn.addEventListener('click', () => {
  hide(splash);
  show(quizScreen);
  initQuiz();
});
</script>
